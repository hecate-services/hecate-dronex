# Build the OCI image for hecate-dronex and push to ghcr.io.
#
# GitHub is canonical since 2026-07-26, so this runs where the code lives.
# Pushes BOTH :latest and the semver tag. The deployed compose tracks :latest
# under watchtower for zero-touch deploys, and the semver tags stay on ghcr so a
# bad release can be pinned back to a known one.
#
# ONE IMAGE NAME, WHERE THERE WERE TWO. This used to publish `hecate-dronex-sim'
# because the tree built two releases from one Containerfile behind a RELEASE
# build-arg. An island is one release, so the image is `hecate-dronex'.
#
# NO EXPERIMENT TAG, AND DELIBERATELY. A sibling tagged every image from a number
# its own physics reported, which is a good mechanism and worth copying back the
# day there is a numbered thing to copy it for. A tag derived from a number that
# does not exist yet is a tag that lies.

name: build-and-push

# ⚠ PATHS-IGNORE, AND IT IS NOT HOUSEKEEPING. Without it every push to main
# builds a new `:latest', watchtower rolls all four islands within three minutes,
# and each island loses whatever it has not written down. On 2026-08-07 a commit
# that touched two markdown files and no code reset the whole archipelago seven
# minutes later. Writing down what an experiment found is not supposed to end it.
#
# Docs cannot change the image, so they do not build one. Anything else does.
on:
  push:
    branches: [main]
    tags:     ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'design/**'
      - 'plans/**'
      - 'LICENSE'
      # Operator tools. The Containerfile copies `rebar.config', `config' and
      # `apps' and nothing else, so a probe or a deploy script cannot change the
      # image and has no business restarting five islands to prove it.
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/hecate-services/hecate-dronex:latest
            ghcr.io/hecate-services/hecate-dronex:${{ steps.tag.outputs.tag }}
